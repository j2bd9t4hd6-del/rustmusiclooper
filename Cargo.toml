[package]
name = "rustmusiclooper"
version = "0.1.0"
edition = "2024"
description = "PyMusicLooper loop point detection re-implemented in Rust"

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
symphonia = { version = "0.6", features = ["aac", "isomp4"] }
rustfft = "6"

[features]
default = ["cli"]
cli = ["dep:clap"]

[lib]
name = "rustmusiclooper"
path = "src/lib.rs"

[[bin]]
name = "rustmusiclooper"
path = "src/main.rs"
required-features = ["cli"]
